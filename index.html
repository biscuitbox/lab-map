<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>과학실 실험장 지도</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Cpath d='M13 4h8M14 4v9L6 27a2.5 2.5 0 0 0 2.2 3.7h17.6A2.5 2.5 0 0 0 28 27l-8-14V4' fill='none' stroke='%231c6a5e' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M13 4h8M14 4v9L6 27a2.5 2.5 0 0 0 2.2 3.7h17.6A2.5 2.5 0 0 0 28 27l-8-14V4" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M9.5 22h15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><rect x="11" y="24" width="4" height="4" rx="1" fill="currentColor" opacity=".55"/><rect x="16" y="24" width="7" height="4" rx="1" fill="currentColor"/></svg>
      <div style="min-width:0">
        <h1><span id="titleText">과학실 실험장 지도</span><input id="siteTitle" class="titleinput" data-ch="siteTitle" aria-label="사이트 제목" title="눌러서 제목 바꾸기" placeholder="사이트 제목" hidden></h1>
      </div>
    </div>
    <div class="topright">
      <label class="search" id="searchWrap" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="물품 찾기 (예: 염산, 비커)" aria-label="물품 찾기" autocomplete="off">
      </label>
      <a class="helplink" href="help.html" target="_blank" rel="noopener">사용설명서</a>
      <div class="acct" id="acct"></div>
    </div>
  </header>
  <nav class="corridor" id="corridor" aria-label="특별실" hidden></nav>
  <div class="stats" id="stats" hidden></div>
  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" data-act="tab" data-view="room"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="15" height="13" rx="1.5"/><path d="M1.5 7.5h15M7 7.5v8"/></svg><span class="tl">배치도</span></button>
    <button role="tab" data-act="tab" data-view="cab" id="tab-cab"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="1.5" width="12" height="14" rx="1.5"/><path d="M3 6.5h12M3 11h12M5 15.5v1.5M13 15.5v1.5"/></svg><span class="tl">실험장 조립</span></button>
    <button role="tab" data-act="tab" data-view="list"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4h9M6.5 9h9M6.5 14h9"/><circle cx="3" cy="4" r=".9" fill="currentColor"/><circle cx="3" cy="9" r=".9" fill="currentColor"/><circle cx="3" cy="14" r=".9" fill="currentColor"/></svg><span class="tl">재고 목록</span></button>
    <button role="tab" data-act="tab" data-view="loans"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12l-3-3M16 12H4l3 3"/></svg><span class="tl">대여 기록</span></button>
    <button role="tab" data-act="tab" data-view="stats"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16h14M4.5 16V9M9 16V4M13.5 16v-5"/></svg><span class="tl">사용 통계</span></button>
    <button role="tab" data-act="tab" data-view="qr"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5.5" height="5.5" rx="1"/><rect x="10.5" y="2" width="5.5" height="5.5" rx="1"/><rect x="2" y="10.5" width="5.5" height="5.5" rx="1"/><path d="M10.5 10.5h2.5v2.5M16 10.5v5.5h-5.5"/></svg><span class="tl">QR 라벨</span></button>
    <button role="tab" data-act="tab" data-view="backup"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5h12v10H3zM1.5 2.5h15v3h-15zM7 9h4"/></svg><span class="tl">백업·휴지통</span></button>
    <button role="tab" data-act="tab" data-view="set"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5h7M13 4.5h3M2 9h2M8 9h8M2 13.5h9M15 13.5h1"/><circle cx="11" cy="4.5" r="2"/><circle cx="6" cy="9" r="2"/><circle cx="13" cy="13.5" r="2"/></svg><span class="tl">설정·사용자</span></button>
  </nav>
  <main>
    <section id="gate"></section>
    <section id="v-room" hidden></section>
    <section id="v-cab" hidden></section>
    <section id="v-list" hidden></section>
    <section id="v-loans" hidden></section>
    <section id="v-stats" hidden></section>
    <section id="v-qr" hidden></section>
    <section id="v-backup" hidden></section>
    <section id="v-set" hidden></section>
  </main>
</div>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
